# Los 9 servicios de la facturacion, para levantar todo de una.
#
# Este archivo NO se usa solo: se fusiona con docker-compose.yml, que es quien
# define la red y las bases. Siempre con los dos -f:
#
#   docker compose -f docker-compose.yml -f docker-compose.servicios.yml up -d
#
# O mas corto, con el alias que deja scripts/entorno.sh:
#
#   ./scripts/levantar.sh
#
# Cada servicio sigue teniendo su propio docker-compose.yml en su repo, para
# trabajarlo aislado. Este es el de "todo junto": usa los mismos nombres de
# imagen y contenedor, asi que no se deben levantar los dos a la vez.

services:
  # ---------------------------------------------------------------- Config
  # Primero: el resto le pide las empresas, los certificados y las plantillas.
  config:
    build: ../Config
    image: config-service:0.2.0
    container_name: config-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONFIG_PORT:-3003}:3003"
    env_file: [../Config/.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- Signer
  signer:
    build: ../Signer
    image: signer-service:0.2.1
    container_name: signer-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIGNER_PORT:-3001}:3001"
    env_file: [../Signer/.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------- XmlGenerator
  # No depende de nada: solo arma el XML con lo que le mandan.
  xml-generator:
    build: ../XmlGenerator
    image: xml-generator-service:0.1.0
    container_name: xml-generator-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GENERADOR_PORT:-3002}:3002"
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------- RideGenerator
  ride-generator:
    build: ../RideGenerator
    image: ride-generator-service:0.1.0
    container_name: ride-generator-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RIDE_PORT:-3007}:3007"
    env_file: [../RideGenerator/.env]
    # Corre con el usuario del equipo para que las copias de los RIDE queden a
    # su nombre y las pueda abrir y borrar.
    user: "${RIDE_UID:-1000}:${RIDE_GID:-1000}"
    environment:
      HOME: /tmp
      RIDE_PDF_FOLDER: /rides
    volumes:
      - ${RIDE_FOLDER_HOST:-../RideGenerator/rides-generados}:/rides
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_healthy
      config:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------ Core
  # Orquesta: necesita a Config, XmlGenerator, Signer y RideGenerator arriba.
  core:
    build: ../Core
    image: core-service:0.2.0
    container_name: core-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT:-3006}:3006"
    env_file: [../Core/.env]
    depends_on:
      mongo:
        condition: service_healthy
      config:
        condition: service_healthy
      xml-generator:
        condition: service_healthy
      signer:
        condition: service_healthy
      ride-generator:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------- SriClient
  sri-client:
    build: ../SriClient
    image: sri-client-service:0.1.2
    container_name: sri-client-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SRI_CLIENT_PORT:-3004}:3004"
    env_file: [../SriClient/.env]
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------- SriQuery
  sri-query:
    build: ../SriQuery
    image: sri-query-service:0.1.0
    container_name: sri-query-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SRI_QUERY_PORT:-3005}:3005"
    env_file: [../SriQuery/.env]
    depends_on:
      mongo:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------- ErpConnector
  # Publicado en 3008: adentro sigue en 3005, pero en el host chocaba con
  # SriQuery.
  erp-connector:
    build: ../ErpConnector
    image: erp-connector-service:0.1.0
    container_name: erp-connector-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERP_CONNECTOR_PORT:-3008}:3005"
    env_file: [../ErpConnector/.env]
    depends_on:
      mongo:
        condition: service_healthy
      config:
        condition: service_healthy
    networks: [pac-invoicing-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
